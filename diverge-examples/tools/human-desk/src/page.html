<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You, the agent</title>
<style>
  /* Fallback: outside the viewer /diverge/theme.css is not served, so the theme's plum five and the roles and sizes
     this page uses are set here as diverge-theme/theme.css sets them; the theme, linked after this, overrides them. */
  :root {
    color-scheme: dark;
    accent-color: var(--accent);
    --ground: #11000e;
    --raised: #22091d;
    --accent: #ffb2ff;
    --ink: #fbeacd;
    --here: #eba52a;
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-mono: max(var(--text-xs), 0.92em);
    --leading: 1.6;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-sm: 0;
    --control: 32px;
    --hit-min: 28px;
    --measure: 63ch;
    --rule: color-mix(in srgb, var(--raised) 91%, var(--ink));
    --note: color-mix(in srgb, var(--raised) 88%, var(--accent));
    --bg: var(--ground);
    --surface: var(--raised);
    --surface-3: var(--rule);
    --line: var(--rule);
    --line-strong: color-mix(in srgb, var(--rule) 60%, var(--ink));
    --line-hover: var(--ink);
    --text: var(--ink);
    --text-2: color-mix(in srgb, var(--ink) 90%, var(--ground));
    --text-3: color-mix(in srgb, var(--ink) 80%, var(--ground));
    --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--ground));
    --accent-hover: color-mix(in srgb, var(--accent) 78%, var(--ink));
    --on-accent: var(--ground);
    --ok: #9dd9ae;
    --bad: #ff9a8f;
    --line-bad: color-mix(in srgb, var(--bad) 45%, var(--line));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: var(--text-md)/var(--leading) var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  /* Focus lights an edge, as hover does; no ring is drawn. */
  :focus-visible { outline: none; }
  ::selection { background: var(--accent-soft); color: var(--text); }
  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-4);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header.top h1 { margin: 0; font-size: var(--text-lg); font-weight: 650; line-height: 1.2; }
  /* A chip: who is at the page (the accent), and how the desk stands (quieter). */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    height: var(--hit-min);
    padding: 0 var(--space-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    line-height: 1.2;
    white-space: nowrap;
  }
  .badge.user { color: var(--accent); }
  .badge.agent { color: var(--accent); }
  .badge.dim { color: var(--text-2); }
  /* A message waits on the person: the note behind it, the accent round it. */
  .badge.waiting { color: var(--text); background: var(--note); border-color: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .spacer { flex: 1; }
  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: var(--space-3) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  #log .empty { color: var(--text-3); margin: auto; max-width: var(--measure); text-align: center; }
  /* A message, as the viewer's log draws one: its label, then its words beside a rule. */
  .bubble {
    align-self: stretch;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bubble .who {
    display: block;
    height: auto;
    margin-bottom: var(--space-1);
    padding: 0;
    border: 0;
    color: var(--accent);
    font-size: var(--text-xs);
    font-weight: 600;
  }
  .bubble .body {
    display: block;
    padding-left: var(--space-2);
    border-left: 1px solid var(--line);
  }
  /* A tool call: a well on the ground, a row with ▸ that turns as it opens, its arguments and answer beside a rule. */
  .call {
    align-self: stretch;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .call:has(> pre.error) { border-color: var(--line-bad); }
  .call summary {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--hit-min);
    padding: 0 var(--space-2);
    color: var(--text-2);
    list-style: none;
    cursor: pointer;
  }
  .call summary::-webkit-details-marker { display: none; }
  .call summary::before { content: "▸"; color: var(--text-3); transition: transform 0.1s; }
  .call[open] summary::before { transform: rotate(90deg); }
  .call summary:hover,
  .call summary:focus-visible { background: var(--surface-3); color: var(--text); }
  .call summary .name { color: var(--text); }
  .call summary .status { color: var(--text-3); font-size: var(--text-sm); }
  /* Answered: the card holds a second block, the answer. */
  .call:has(> pre + pre) summary .status { color: var(--ok); }
  .call summary .status.error { color: var(--bad); }
  .call pre {
    margin: var(--space-1) var(--space-2) var(--space-2) var(--space-5);
    padding-left: var(--space-2);
    border-left: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: var(--text-mono);
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 320px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  .call pre.error { color: var(--bad); border-left-color: var(--line-bad); }
  /* An answer with no card of its own: a well of its own. */
  #log > pre {
    margin: 0;
    padding: var(--space-2);
    border: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: var(--text-mono);
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #log > pre.error { color: var(--bad); border-color: var(--line-bad); }
  .notice { align-self: center; color: var(--text-3); font-size: var(--text-sm); }
  footer.desk {
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: var(--space-3) var(--space-4);
    display: grid;
    gap: var(--space-2);
  }
  footer.desk.idle .act { opacity: 0.45; pointer-events: none; }
  .row { display: flex; gap: var(--space-2); align-items: flex-start; }
  /* Fields: a well on the ground with a pressable edge, which lights under the mouse and in focus. */
  textarea, select {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    outline: none;
  }
  textarea {
    flex: 1;
    min-width: 0;
    padding: var(--space-1) var(--space-2);
    line-height: 22px;
    resize: vertical;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  textarea.code { font-family: var(--font-mono); font-size: var(--text-mono); line-height: 20px; }
  textarea::placeholder { color: var(--text-3); }
  select { height: var(--control); padding: 0 var(--space-2); max-width: 100%; line-height: 1.2; }
  textarea:hover, textarea:focus-visible,
  select:hover, select:focus-visible { border-color: var(--line-hover); }
  /* Buttons: a pressable edge, no fill, lit under the mouse and in focus. */
  button {
    height: var(--control);
    padding: 0 var(--space-4);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--text);
    font: 500 var(--text-sm)/1.2 var(--font-ui);
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover, button:focus-visible { border-color: var(--line-hover); }
  /* Send, the one action that goes ahead: the accent filled, lighter under the mouse. */
  button.go { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
  button.go:hover:not(:disabled),
  button.go:focus-visible { border-color: var(--accent-hover); background: var(--accent-hover); }
  button.go:disabled { border-color: var(--line); background: none; color: var(--text-3); cursor: default; }
  /* ↻: a square as tall as the tool list beside it, the glyph quieter than words. */
  #refresh { width: var(--control); padding: 0; color: var(--text-2); font-size: var(--text-md); line-height: 1; }
  .description { color: var(--text-2); font-size: var(--text-sm); white-space: pre-wrap; }
  #said { color: var(--bad); font-size: var(--text-sm); min-height: 1em; }
  .hint { color: var(--text-3); font-size: var(--text-sm); }
  @media (prefers-reduced-motion: reduce) {
    .badge.waiting { animation: none; }
    .call summary::before { transition: none; }
  }
</style>
<link rel="stylesheet" href="/diverge/theme.css">
<script src="/diverge/theme.js"></script>
</head>
<body>
<header class="top">
  <h1>You are the agent</h1>
  <span id="me" class="badge dim">…</span>
  <span class="spacer"></span>
  <span id="state" class="badge dim">connecting…</span>
</header>
<div id="log"><p class="empty">Nothing has happened yet. When someone messages this agent, the message appears here and waits for you.</p></div>
<footer id="desk" class="desk idle">
  <div class="row act">
    <textarea id="reply" rows="2" placeholder="Reply as the agent… (Ctrl+Enter sends)"></textarea>
    <button id="send" class="go" type="button">Send</button>
  </div>
  <div class="row act">
    <select id="tool"><option value="">no tools</option></select>
    <button id="refresh" type="button" title="List the tools again">↻</button>
    <span class="spacer"></span>
    <button id="end" class="end" type="button">End turn</button>
  </div>
  <div id="about" class="description act"></div>
  <div class="row act">
    <textarea id="arguments" class="code" rows="3" spellcheck="false" placeholder="{}"></textarea>
    <button id="call" class="tool" type="button">Call</button>
  </div>
  <div id="said"></div>
  <div class="hint">Nothing reaches whoever messaged the agent until you end the turn: then everything you did goes back as the agent's turn.</div>
</footer>
<script>
"use strict";
const log = document.getElementById("log");
const desk = document.getElementById("desk");
const stateBadge = document.getElementById("state");
const meBadge = document.getElementById("me");
const reply = document.getElementById("reply");
const toolSelect = document.getElementById("tool");
const about = document.getElementById("about");
const argumentsBox = document.getElementById("arguments");
const said = document.getElementById("said");

let socket = null;
let tools = [];
let waiting = false;
// The open user bubble, to which further parts of the same message go.
let lastIn = null;
// Each call's card, by id, so its response lands in it.
const calls = new Map();

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrolled(fn) {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  fn();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function setWaiting(value) {
  waiting = value;
  desk.classList.toggle("idle", !waiting);
  stateBadge.className = "badge " + (waiting ? "waiting" : "dim");
  stateBadge.textContent = waiting ? "a message is waiting on you" : "idle";
  if (waiting) reply.focus();
}

function partText(chunk) {
  switch (chunk.type) {
    case "user_text_content": return chunk.text;
    case "user_image_content": return "[image " + (chunk.mimeType || "") + "]";
    case "user_audio_content": return "[audio " + (chunk.mimeType || "") + "]";
    case "user_resource": return "[resource " + ((chunk.resource && chunk.resource.uri) || "") + "]";
    case "user_resource_link": return "[link " + (chunk.uri || "") + "]";
    default: return null;
  }
}

function resultText(result) {
  const parts = (result.content || []).map((block) => block.type === "text" ? block.text : JSON.stringify(block, null, 2));
  if (result.structuredContent !== undefined && parts.length === 0) parts.push(JSON.stringify(result.structuredContent, null, 2));
  return parts.join("\n") || "(no content)";
}

function pretty(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text || ""; }
}

function show(entry) {
  const chunk = entry.chunk;
  const text = partText(chunk);
  if (text !== null) {
    if (lastIn && lastIn.dataset.key === chunk.key) {
      lastIn.querySelector(".body").textContent += "\n" + text;
      return;
    }
    const bubble = el("div", "bubble in");
    bubble.dataset.key = chunk.key;
    bubble.append(el("span", "who badge user", "message"), el("span", "body", text));
    log.append(bubble);
    lastIn = bubble;
    return;
  }
  lastIn = null;
  switch (chunk.type) {
    case "assistant_text_content": {
      const bubble = el("div", "bubble out");
      bubble.append(el("span", "who badge agent", "you, as the agent"), el("span", "body", chunk.text));
      log.append(bubble);
      return;
    }
    case "assistant_tool_call": {
      const card = el("details", "call");
      const summary = el("summary");
      summary.append(el("span", "name", chunk.name), el("span", "status", "running…"));
      card.append(summary, el("pre", "", pretty(chunk.arguments)));
      calls.set(chunk.id, card);
      log.append(card);
      return;
    }
    case "tool_response": {
      const card = calls.get(chunk.id);
      const body = el("pre", chunk.isError ? "error" : "", resultText(chunk));
      if (!card) { log.append(body); return; }
      const status = card.querySelector(".status");
      status.textContent = chunk.isError ? "error" : "done";
      status.classList.toggle("error", Boolean(chunk.isError));
      card.append(body);
      return;
    }
    case "notification":
      log.append(el("div", "notice", JSON.stringify(chunk.message)));
      return;
    default:
      return;
  }
}

function resetLog() {
  log.replaceChildren();
  lastIn = null;
  calls.clear();
}

function skeleton(schema) {
  if (!schema || typeof schema !== "object") return {};
  const out = {};
  const properties = schema.properties || {};
  for (const [name, property] of Object.entries(properties)) {
    if (property && "default" in property) { out[name] = property.default; continue; }
    const type = Array.isArray(property && property.type) ? property.type[0] : property && property.type;
    out[name] = type === "string" ? "" : type === "integer" || type === "number" ? 0 : type === "boolean" ? false : type === "array" ? [] : type === "object" ? {} : null;
  }
  return out;
}

function chooseTool() {
  const tool = tools.find((candidate) => candidate.name === toolSelect.value);
  about.textContent = tool ? (tool.description || "") : "";
  argumentsBox.value = tool ? JSON.stringify(skeleton(tool.inputSchema), null, 2) : "";
}

function setTools(list, error) {
  const previous = toolSelect.value;
  tools = list;
  toolSelect.replaceChildren();
  if (tools.length === 0) toolSelect.append(el("option", "", error ? "tools could not be listed" : "no tools"));
  for (const tool of tools) {
    const option = el("option", "", tool.name);
    option.value = tool.name;
    toolSelect.append(option);
  }
  if (tools.some((tool) => tool.name === previous)) toolSelect.value = previous;
  chooseTool();
  said.textContent = error ? "Tools: " + error : "";
}

function act(value) {
  said.textContent = "";
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(value));
}

document.getElementById("send").addEventListener("click", () => {
  const text = reply.value;
  if (!text.trim()) return;
  act({ type: "reply", text });
  reply.value = "";
});
reply.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    document.getElementById("send").click();
  }
});
document.getElementById("call").addEventListener("click", () => {
  if (!toolSelect.value) return;
  let parsed;
  try { parsed = JSON.parse(argumentsBox.value || "{}"); } catch (error) { said.textContent = "The arguments are not JSON: " + error.message; return; }
  if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) { said.textContent = "The arguments must be a JSON object."; return; }
  act({ type: "call", name: toolSelect.value, arguments: parsed });
});
document.getElementById("end").addEventListener("click", () => act({ type: "end" }));
document.getElementById("refresh").addEventListener("click", () => act({ type: "tools" }));
toolSelect.addEventListener("change", chooseTool);

function connect() {
  const url = new URL("ws", location.href);
  url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  url.search = "";
  socket = new WebSocket(url);
  socket.addEventListener("message", (event) => {
    const told = JSON.parse(event.data);
    switch (told.type) {
      case "me":
        meBadge.textContent = told.identity.subject + " @ " + told.identity.issuer;
        meBadge.className = "badge user";
        return;
      case "hello":
        resetLog();
        if (told.transcript.length === 0) log.append(el("p", "empty", "Nothing has happened yet. When someone messages this agent, the message appears here and waits for you."));
        for (const entry of told.transcript) show(entry);
        log.scrollTop = log.scrollHeight;
        setWaiting(told.waiting);
        return;
      case "entry":
        scrolled(() => {
          const empty = log.querySelector(".empty");
          if (empty) empty.remove();
          show(told.entry);
        });
        return;
      case "state":
        setWaiting(told.waiting);
        return;
      case "tools":
        setTools(told.tools || [], told.error);
        return;
      case "refused":
        said.textContent = told.error;
        return;
      case "trouble":
        said.textContent = told.error;
        return;
      default:
        return;
    }
  });
  socket.addEventListener("close", () => {
    stateBadge.className = "badge dim";
    stateBadge.textContent = "reconnecting…";
    desk.classList.add("idle");
    setTimeout(connect, 1500);
  });
}
connect();
</script>
</body>
</html>
