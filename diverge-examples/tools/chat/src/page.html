<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  /* Fallback: /diverge/theme.css (linked below) sets all of these, but only the Viewer
     serves it; anywhere else that link misses and the page keeps plum and gold from here.
     The five, then only the roles and tokens this page names, each as theme.css has it. */
  :root {
    color-scheme: dark;
    --ground: #11000e;
    --raised: #22091d;
    --accent: #ffb2ff;
    --ink: #fbeacd;
    --here: #eba52a;

    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-mono: max(var(--text-xs), 0.92em);
    --leading: 1.6;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --radius-sm: 0;
    --control: 32px;
    --hit-min: 28px;
    --measure: 63ch;

    --rule: color-mix(in srgb, var(--raised) 91%, var(--ink));
    --bg: var(--ground);
    --surface: var(--raised);
    --surface-3: var(--rule);
    --line: var(--rule);
    --line-strong: color-mix(in srgb, var(--rule) 60%, var(--ink));
    --line-hover: var(--ink);
    --text: var(--ink);
    --text-2: color-mix(in srgb, var(--ink) 90%, var(--ground));
    --text-3: color-mix(in srgb, var(--ink) 80%, var(--ground));
    --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--ground));
    --accent-hover: color-mix(in srgb, var(--accent) 78%, var(--ink));
    --on-accent: var(--ground);
    --bad: #ff9a8f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: var(--text-md);
    line-height: var(--leading);
    -webkit-font-smoothing: antialiased;
    scrollbar-color: var(--line-strong) transparent;
  }
  button, textarea { font: inherit; color: inherit; }
  /* Focus looks as hover does, each control lighting its own edge: no ring. */
  :focus-visible { outline: none; }
  ::selection { background: var(--accent-soft); color: var(--text); }

  /* The bars, the title's and the tabs', on the raised surface, a plain rule under each. */
  header.top {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-4);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header.top h1 {
    margin: 0;
    font-size: var(--text-lg);
    font-weight: 650;
    line-height: 1.2;
  }
  /* A badge is a chip: the floor height, a pressable edge, square. Who acts (the account,
     the agent) is named in the accent; a quiet fact (the image) in quieter words. */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    height: var(--hit-min);
    padding: 0 var(--space-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    line-height: 1.2;
    white-space: nowrap;
  }
  .badge.user,
  .badge.agent { color: var(--accent); }
  .badge.dim { color: var(--text-2); }

  /* The tabs, chips you press; the one shown filled with the soft accent, its words full and heavier. */
  nav.tabs {
    display: flex;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-4);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  nav.tabs:empty { display: none; }
  nav.tabs button {
    flex: none;
    display: inline-flex;
    align-items: center;
    height: var(--hit-min);
    padding: 0 var(--space-3);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--text-2);
    font-size: var(--text-sm);
    font-weight: 500;
    line-height: 1.2;
    cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button:hover,
  nav.tabs button:focus-visible { border-color: var(--line-hover); }
  nav.tabs button.on {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 600;
  }
  /* A tab with a message not yet seen: a small accent dot after its name. */
  nav.tabs .unseen::after {
    content: "";
    width: 6px;
    height: 6px;
    margin-left: var(--space-2);
    background: var(--accent);
  }

  main { flex: 1; min-height: 0; display: flex; }
  section.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  section.pane[hidden] { display: none; }
  .who {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    border-bottom: 1px solid var(--line);
  }

  /* Image info: a disclosure row with ▸, which turns as it opens, its band lit under the
     mouse; inside, the JSON and the DIVERGE.md in a mono well. */
  details.image { padding: 0 var(--space-4); border-bottom: 1px solid var(--line); }
  details.image summary {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--hit-min);
    margin: 0 calc(-1 * var(--space-2));
    padding: 0 var(--space-2);
    list-style: none;
    color: var(--text-2);
    font-size: var(--text-sm);
    cursor: pointer;
  }
  details.image summary::-webkit-details-marker { display: none; }
  details.image summary::before {
    content: "▸";
    color: var(--text-3);
    transition: transform 0.1s;
  }
  details.image[open] summary::before { transform: rotate(90deg); }
  details.image summary:hover,
  details.image summary:focus-visible {
    background: var(--surface-3);
    color: var(--text);
  }
  details.image pre {
    max-height: 30vh;
    overflow: auto;
    margin: var(--space-1) 0 var(--space-3);
    padding: var(--space-2) var(--space-3);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    white-space: pre-wrap;
    font-family: var(--font-mono);
    font-size: var(--text-mono);
    line-height: 1.5;
  }

  /* The conversation, as the Viewer's log: each message a header line (who, then when),
     then its words beside a plain rule, every one from the left. */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-3) var(--space-4) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .message .meta {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    margin-bottom: var(--space-1);
  }
  /* The sender, a plain small label: the person and the agent alike in the accent, told apart by name. */
  .message .meta .badge {
    height: auto;
    padding: 0;
    border: 0;
    color: var(--accent);
    font-size: var(--text-xs);
    font-weight: 600;
  }
  .message .meta > span:not(.badge) {
    margin-left: auto;
    color: var(--text-3);
    font-size: var(--text-xs);
    font-variant-numeric: tabular-nums;
  }
  .message .body {
    max-width: var(--measure);
    padding-left: var(--space-2);
    border-left: 1px solid var(--line);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .note {
    margin: 0;
    color: var(--text-3);
    font-size: var(--text-sm);
    font-style: italic;
    text-align: center;
  }
  .note.error { color: var(--bad); }
  main > .note,
  .empty { margin: auto; }
  .empty {
    color: var(--text-3);
    font-size: var(--text-sm);
    font-style: italic;
  }

  /* The composer: under the log on the raised surface, the text box a well on the ground
     with a pressable edge, and Send, the accent filled. */
  form.write {
    display: flex;
    align-items: flex-end;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  form.write textarea {
    flex: 1;
    min-width: 0;
    min-height: var(--control);
    max-height: 30vh;
    resize: vertical;
    padding: var(--space-1) var(--space-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font-size: var(--text-md);
    line-height: 22px;
    outline: none;
  }
  form.write textarea::placeholder { color: var(--text-3); }
  form.write textarea:hover,
  form.write textarea:focus-visible { border-color: var(--line-hover); }
  form.write button {
    flex: none;
    height: var(--control);
    padding: 0 var(--space-4);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--on-accent);
    font-size: var(--text-sm);
    font-weight: 500;
    line-height: 1.2;
    cursor: pointer;
  }
  form.write button:hover:not(:disabled),
  form.write button:focus-visible {
    border-color: var(--accent-hover);
    background: var(--accent-hover);
  }
  form.write button:disabled {
    border-color: var(--line);
    background: none;
    color: var(--text-3);
    cursor: default;
  }
</style>
<link rel="stylesheet" href="/diverge/theme.css">
<script src="/diverge/theme.js"></script>
</head>
<body>
<header class="top">
  <h1>Chat</h1>
  <span id="me" class="badge user">…</span>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="panes"><p class="empty">Reading the agents…</p></main>
<script>
"use strict";

// One badge: a pill of text in a role's colour.
function badge(text, role, title) {
  const span = document.createElement("span");
  span.className = "badge " + role;
  span.textContent = text;
  if (title) span.title = title;
  return span;
}

// A person, as a badge's words: the subject, with the issuer beside.
function personWords(issuer, subject) {
  return subject + " @ " + issuer;
}

// An agent's badges: its name if it has one, its template's first
// eight characters and its index, and its image's name.
function agentBadges(agent) {
  const badges = [];
  if (agent.name) badges.push(badge(agent.name, "agent"));
  badges.push(badge(agent.template.slice(0, 8) + " #" + agent.index, "agent", "template " + agent.template + ", index " + agent.index));
  const image = agent.document ? agent.document.name : "no DIVERGE.md";
  badges.push(badge("image: " + image, "dim", agent.digest));
  return badges;
}

// One message, drawn: its author's badge, when it was written, and
// what it says.
function drawMessage(message, agent) {
  const item = document.createElement("div");
  item.className = "message " + message.author;
  const meta = document.createElement("div");
  meta.className = "meta";
  if (message.author === "user") {
    meta.append(badge(personWords(message.issuer, message.subject), "user"));
  } else {
    meta.append(badge(message.name || agent.name || agent.template.slice(0, 8) + " #" + agent.index, "agent"));
  }
  const when = document.createElement("span");
  when.textContent = new Date(message.created).toLocaleString();
  meta.append(when);
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = message.body;
  item.append(meta, body);
  return item;
}

// A note in the conversation: the socket's state, or an error.
function note(text, error) {
  const p = document.createElement("p");
  p.className = "note" + (error ? " error" : "");
  p.textContent = text;
  return p;
}

// One tab: its conversation with one agent, over a socket of its own,
// opened again a moment after it closes.
class Conversation {
  constructor(agent, button, pane) {
    this.agent = agent;
    this.button = button;
    this.pane = pane;
    this.shown = false;
    const who = document.createElement("div");
    who.className = "who";
    who.append(...agentBadges(agent));
    const image = document.createElement("details");
    image.className = "image";
    const summary = document.createElement("summary");
    summary.textContent = "Image info";
    const pre = document.createElement("pre");
    pre.textContent = agent.document
      ? JSON.stringify({ name: agent.document.name, frontend: !!agent.document.frontend, schema: agent.document.schema }, null, 2) + "\n\n" + agent.document.body
      : "The image ships no DIVERGE.md: " + agent.digest;
    image.append(summary, pre);
    this.log = document.createElement("div");
    this.log.className = "log";
    const form = document.createElement("form");
    form.className = "write";
    this.input = document.createElement("textarea");
    this.input.placeholder = "Write to " + (agent.name || "the agent") + " — Enter sends, Shift+Enter is a new line";
    this.send = document.createElement("button");
    this.send.type = "submit";
    this.send.textContent = "Send";
    this.send.disabled = true;
    form.append(this.input, this.send);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      this.write();
    });
    this.input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        this.write();
      }
    });
    pane.append(who, image, this.log, form);
    this.open();
  }

  // The socket: the history replaces the log, every message after it is
  // added, and a close opens it again two seconds later.
  open() {
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/frontend/ws?template=" + encodeURIComponent(this.agent.template) + "&index=" + this.agent.index;
    const socket = new WebSocket(url);
    this.socket = socket;
    socket.addEventListener("open", () => { this.send.disabled = false; });
    socket.addEventListener("message", (event) => {
      const said = JSON.parse(event.data);
      if (said.type === "history") {
        this.log.replaceChildren(...said.messages.map((message) => drawMessage(message, this.agent)));
        if (said.messages.length === 0) this.log.append(note("No messages yet."));
        this.bottom();
      } else if (said.type === "message") {
        this.log.querySelector(".note:not(.error)")?.remove();
        this.log.append(drawMessage(said.message, this.agent));
        this.bottom();
        if (!this.shown && said.message.author === "agent") this.button.classList.add("unseen");
      } else if (said.type === "lagged") {
        socket.close();
      } else if (said.type === "error") {
        this.log.append(note(said.error, true));
        this.bottom();
      }
    });
    socket.addEventListener("close", () => {
      this.send.disabled = true;
      if (this.socket === socket) setTimeout(() => this.open(), 2000);
    });
  }

  // The person's message, sent on the socket; the server shows it back
  // once it is kept.
  write() {
    const text = this.input.value;
    if (!text.trim() || this.socket.readyState !== WebSocket.OPEN) return;
    this.socket.send(text);
    this.input.value = "";
  }

  bottom() {
    this.log.scrollTop = this.log.scrollHeight;
  }

  show(on) {
    this.shown = on;
    this.pane.hidden = !on;
    this.button.classList.toggle("on", on);
    if (on) {
      this.button.classList.remove("unseen");
      this.bottom();
      this.input.focus();
    }
  }
}

async function start() {
  const me = await fetch("api/me").then((answer) => answer.json());
  const meBadge = document.getElementById("me");
  meBadge.textContent = me.identity ? personWords(me.identity.issuer, me.identity.subject) : "unknown";
  if (me.scope) meBadge.title = "scope " + me.scope;
  const listed = await fetch("api/agents").then((answer) => answer.json());
  const tabs = document.getElementById("tabs");
  const panes = document.getElementById("panes");
  if (listed.error) {
    panes.replaceChildren(note(listed.error, true));
    return;
  }
  if (listed.agents.length === 0) {
    panes.replaceChildren(note("No agent is attached to this chat."));
    return;
  }
  panes.replaceChildren();
  const conversations = listed.agents.map((agent) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = agent.name || agent.template.slice(0, 8) + " #" + agent.index;
    const pane = document.createElement("section");
    pane.className = "pane";
    pane.hidden = true;
    tabs.append(button);
    panes.append(pane);
    return new Conversation(agent, button, pane);
  });
  const choose = (chosen) => conversations.forEach((conversation) => conversation.show(conversation === chosen));
  conversations.forEach((conversation) => conversation.button.addEventListener("click", () => choose(conversation)));
  choose(conversations[0]);
}

start().catch((error) => {
  document.getElementById("panes").replaceChildren(note(String(error), true));
});
</script>
</body>
</html>
