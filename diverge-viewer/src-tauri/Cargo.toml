[package]
name = "diverge-viewer"
version = "1.0.0"
edition = "2024"
description = "Diverge Viewer"
publish = false

[dependencies]
# The wire. Rust holds the one connection to the daemon and speaks the
# frames for the page, through the SDK's own `tauri_proxy` runner,
# which dials the daemon again as `viewer.yaml`'s `redial` says; the
# identity it presents is one of the root's `identities`.
diverge-sdk = { path = "../../diverge-sdk-rs", features = ["tauri-proxy", "identities"] }
# `viewer.yaml`, read with the app's own type (`src/config/`): which
# daemon, as whom, and how it is dialled again. YAML, with the path to
# what was wrong in a file that does not parse.
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
# The daemons and their accounts, by name, in the order they were added.
indexmap = { version = "2.14.2", features = ["serde"] }

tauri = { version = "2.12.6", features = [] }
# The system's save and folder dialogs a download asks where to put it
# with. Not Tauri's dialog plugin, whose versions require a newer Tauri.
rfd = "0.18.0"
# Downloads and uploads, between the disk and the wire in pieces
# (`transfer.rs`).
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# A tool's frontend, served to the page's frame from a server of the
# app's own on the loopback (`frontend.rs`): every request one daemon
# frontend request, an upgrade piped both ways.
axum = "0.8.9"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }

# A link that asks for a new window, opened in the person's own
# browser instead (`main.rs`).
webbrowser = "=1.2.7"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
