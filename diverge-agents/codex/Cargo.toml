[package]
name = "diverge-agentic-loop-codex"
version = "1.0.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The Codex agent container of the Diverge provider protocol"
license = "MIT"
repository = "https://github.com/divergenetwork/Diverge"
homepage = "https://diverge.network"
publish = false

[dependencies]
# The loop's door: an HTTP server on the loopback the proxy forwards
# to — `/run` as server-sent events, the queue's two verbs, the
# schema. Default features carry the JSON extractor and the HTTP/1
# server; SSE is axum's own.
axum = { version = "0.8.9" }
# Path-only: this crate rides the workspace and is never published, so
# the SDKs are named by where they live rather than by version pins
# version.sh would have to chase. The provider SDK is the vocabulary —
# the chunks, the fates; the canonical bytes a kept login's argument
# is hashed over; the container
# SDK is the proxy beside this program — the registration it makes on
# this server, the database URL, and
# the MCP URL Codex is configured with.
diverge-sdk = { path = "../../diverge-sdk-rs" }
# The agent's JSON Schema, derived from the agent types for
# `--schema`.
schemars = { version = "1.2.3" }
# The run's outbound stream, as a generator.
async-stream = { version = "0.3.6" }
# `Stream` and its combinators, for the chunk stream the response is.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# The chunk vocabulary's content types (tool results, text content)
# — model types only, no transport; Codex is driven as a process.
rmcp = { version = "3.11.0", default-features = false }
# The derives under the agent module, the response module, and the
# config the harness renders.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Codex's `config.toml`, rendered from the agent.
toml = { version = "1.2" }
# Postgres, through the proxy's loopback pgwire, for the continuation:
# `postgres` and the rustls TLS the driver wants at compile time,
# though the loopback negotiates none. No macros. Version: the
# workspace lock's.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
# The hash a kept `auth_file` login is stored under: SHA-256 of the
# argument it was kept for. Version: the SDK's own pin.
sha2 = { version = "=0.11.1" }
# The tool-call ids this container mints: v4 uuids.
uuid = { version = "1.29.3", features = ["v4"] }
# The runtime under the listener, `sync` for the queue's mutex and
# the claim's Notify, `process` + `io-util` for the Codex process and
# its lines, `fs` for the config, the login file and the rollouts.
# No `macros` — the runtime is built in main, not attributed onto it.
tokio = { version = "1.54.1", default-features = false, features = ["fs", "io-util", "net", "process", "rt-multi-thread", "sync"] }
