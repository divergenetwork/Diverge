name: Release

# One release of everything, keyed off one version: the SDK crate's, in
# diverge-sdk-rs/Cargo.toml, which version.sh keeps every other manifest
# equal to.
#
# WHEN IT RUNS
#
#   Only when it is dispatched by hand (Actions UI, or
#   `gh workflow run release.yml --ref main`). No push starts it, whatever
#   the push changes. A dispatch releases the version on main if the
#   GitHub Release `v<version>` does not exist. With `force=true` it runs
#   even if it does: every piece skips what is already published, so
#   this is how a partly failed release is finished.
#
# WHAT IT RELEASES
#
#   • One archive per platform, uploaded to the release as soon as that
#     platform is built, so one slow or failed platform holds back no
#     other: diverge-<version>-<os>-<arch>.tar.gz (.zip on Windows) with
#     its .sha256, holding the CLI, the daemon, the provider, the
#     Postgres supervisor, the viewer and the container proxy
#     (package-diverge.sh).
#   • diverge-sdk on crates.io.
#   • @diverge/sdk on npm.
#
# ORDER
#
#   check ─┬─ create-release ─┬─ binaries (x86_64: linux, macos, windows)
#          ├─ proxy-x86_64 ───┘
#          ├─ create-release ─┬─ binaries (aarch64: linux, macos, windows)
#          ├─ proxy-aarch64 ──┘
#          ├─ sdk-rust
#          └─ sdk-javascript
#
#   The container proxy runs inside Linux containers whatever the host,
#   so it is built once per architecture, on Linux, and each platform of
#   that architecture takes it from there. The two architectures share no
#   job, so a shortage of one's runners does not hold the other. The two
#   SDKs depend on nothing here and on each other not at all.
#
# THE POSTGRES INSIDE
#
#   diverge-postgres bakes a PostgreSQL build in at compile time, fetched
#   from theseus-rs/postgresql-binaries. Left alone it takes whatever is
#   newest on the day, so POSTGRESQL_VERSION below pins it: every platform
#   of a release then ships the same one, and it moves by a commit. A
#   daemon's data is one major version's, so never move it across a major
#   without a plan for the data already out there. 18.7.0 is the first
#   upstream release with a build for Windows on ARM.
#
# RUNNERS (looked up 2026-11-16; github.com/actions/runner-images)
#
#   • Each platform builds on the image GitHub's `-latest` label names
#     today, written out so that it changes by a commit and not by
#     itself: Ubuntu 24.04, macOS 26, Windows Server 2025. A Linux binary
#     runs on its build host's glibc and newer, so these archives need
#     Ubuntu 24.04's (2.39) or later; an older image would reach older
#     distributions, and is not worth it here.
#   • The image's version does not change the speed: every image of a
#     platform runs on the same machines (4 cores and 16 GB for Linux and
#     Windows, 4 and 14 for Intel macOS, 3 and 7 for ARM macOS).
#   • Windows is pinned to `windows-2025`, which is what `windows-latest`
#     names today, so that it changes by a commit and not by itself.
#     Windows on ARM is `windows-11-arm`, the only image there is for it.
#   • The jobs that build nothing platform-bound run on `ubuntu-latest`.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if v<version> exists (each piece skips what is already published)'
        type: boolean
        default: false

permissions:
  contents: write   # create the release, upload the archives
  id-token: write   # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  POSTGRESQL_VERSION: '=18.7.0'

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read_version() { awk -F'"' '/^version = "[^"]+"/ { print $2; exit }'; }
          VERSION="$(read_version < diverge-sdk-rs/Cargo.toml)"
          [ -n "$VERSION" ] || { echo "no version in diverge-sdk-rs/Cargo.toml" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version: $VERSION"

          exists=false
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then exists=true; fi

          release=false
          if [ "$FORCE" = "true" ]; then
            echo "dispatched with force: running, each piece skipping what is published"
            release=true
          elif [ "$exists" = "true" ]; then
            echo "v$VERSION is released already, and force was not given: nothing to do"
          else
            echo "v$VERSION is not released: releasing"
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create the release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create it if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "v$VERSION exists: left as it is"
            exit 0
          fi
          cat > notes.md <<EOF
          Diverge $VERSION.

          One archive per platform, each holding every program: \`diverge\` (the CLI), \`diverge-daemon\`, \`diverge-provider\`, \`diverge-postgres\`, \`diverge-viewer\` and \`diverge-container-proxy\`. Unpack it and put the programs together in one folder on your \`PATH\`; they find one another beside themselves. Each archive has a \`.sha256\` beside it. An archive appears here as its platform finishes building.

          The skills, for an agent that uses Diverge: \`diverge-skills-$VERSION.zip\`, one folder per skill. \`diverge update <SKILLS_DIR>\` installs them.

          The SDKs: [\`diverge-sdk\`](https://crates.io/crates/diverge-sdk) on crates.io and [\`@diverge/sdk\`](https://www.npmjs.com/package/@diverge/sdk) on npm, at the same version.
          EOF
          gh release create "v$VERSION" --repo "$REPO" --target "$SHA" --title "v$VERSION" --notes-file notes.md --latest

  # ── The container proxy: musl Linux, once per architecture ──────────────

  proxy-x86_64:
    name: container proxy (x86_64)
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # zig is the C toolchain ring needs for musl; cargo-zigbuild's wheel
      # brings it.
      - run: pip install cargo-zigbuild
      - run: cargo zigbuild --release --locked -p diverge-container-proxy --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: proxy-x86_64
          path: target/x86_64-unknown-linux-musl/release/diverge-container-proxy
          if-no-files-found: error

  proxy-aarch64:
    name: container proxy (aarch64)
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - run: pip install cargo-zigbuild
      - run: cargo zigbuild --release --locked -p diverge-container-proxy --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: proxy-aarch64
          path: target/aarch64-unknown-linux-musl/release/diverge-container-proxy
          if-no-files-found: error

  # ── The archives: one job per platform, each uploading its own ──────────
  # Two jobs with the same steps, since `needs` is a job's and not a matrix
  # row's: each architecture waits for its own proxy and no other.

  binaries-x86_64:
    name: archive (${{ matrix.os }}-x86_64)
    needs: [check, create-release, proxy-x86_64]
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   runs-on: ubuntu-24.04 }
          - { os: macos,   runs-on: macos-26-intel }
          - { os: windows, runs-on: windows-2025 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: proxy-x86_64
          path: proxy
      - name: Build and pack
        shell: bash
        env:
          # The Postgres archive the supervisor bakes in is fetched from
          # GitHub at build time; the token keeps it under the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash package-diverge.sh dist --proxy proxy/diverge-container-proxy
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/diverge-* --clobber --repo "$REPO"

  binaries-aarch64:
    name: archive (${{ matrix.os }}-aarch64)
    needs: [check, create-release, proxy-aarch64]
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   runs-on: ubuntu-24.04-arm }
          - { os: macos,   runs-on: macos-26 }
          - { os: windows, runs-on: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: proxy-aarch64
          path: proxy
      - name: Build and pack
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash package-diverge.sh dist --proxy proxy/diverge-container-proxy
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/diverge-* --clobber --repo "$REPO"

  # ── The skills: one archive, the same for every platform ────────────────
  skills:
    name: archive (skills)
    needs: [check, create-release]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pack
        run: bash package-skills.sh dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/diverge-skills-* --clobber --repo "$REPO"

  # ── The SDKs ────────────────────────────────────────────────────────────
  # Each skips a version that is published already, so a run that is
  # repeated publishes only what is missing. Neither waits for an archive:
  # a registry cannot take a version back, but neither can an archive
  # failing make the SDK any less the one this commit states.

  sdk-rust:
    name: SDK · rust (crates.io)
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish diverge-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # The sparse index's path for a name of four letters or more:
          # its first two, its next two, the name.
          if curl -fsS "https://index.crates.io/di/ve/diverge-sdk" 2>/dev/null | grep -q "\"vers\":\"$VERSION\""; then
            echo "diverge-sdk $VERSION is on crates.io already: skipped"
            exit 0
          fi
          cargo publish --locked -p diverge-sdk

  sdk-javascript:
    name: SDK · javascript (npm)
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Nothing of the package is committed built: its dist is made here,
      # from this commit.
      - run: pnpm --filter @diverge/sdk run build
      - name: Publish @diverge/sdk
        working-directory: diverge-sdk-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@diverge/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@diverge/sdk $VERSION is on npm already: skipped"
            exit 0
          fi
          pnpm publish --access public --no-git-checks --provenance
